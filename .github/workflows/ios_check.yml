name: iOS Deep Compiler Validation
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-ios-framework:
    name: Flutter iOS Diagnostic Check
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi -e beta -e rc | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Resolve Flutter Dependencies
        run: flutter pub get

      - name: Regenerate Missing iOS Scaffolding
        run: |
          if [ ! -d "ios" ] || [ ! -f "ios/Podfile" ]; then
            echo "iOS directory or Podfile missing. Re-generating scaffolding..."
            flutter create --platforms ios .
          fi

      - name: Inject iOS Camera Permissions (Info.plist)
        run: |
          INFOPLIST="ios/Runner/Info.plist"
          echo "Injecting privacy strings into $INFOPLIST..."
          # -replace creates the key if missing and overwrites it if present
          plutil -replace NSCameraUsageDescription -string "This app requires camera access to capture photos and scan codes." "$INFOPLIST"
          plutil -replace NSMicrophoneUsageDescription -string "This app requires microphone access to record videos." "$INFOPLIST"
          plutil -replace NSPhotoLibraryUsageDescription -string "This app requires library access to save or upload assets." "$INFOPLIST"
          plutil -replace NSPhotoLibraryAddUsageDescription -string "This app requires permission to save photos and videos to your library." "$INFOPLIST"
          plutil -lint "$INFOPLIST"
          echo "--- Verified Info.plist Permissions ---"
          plutil -p "$INFOPLIST" | grep -E "UsageDescription"

      - name: Configure Podfile Platform & Camera Macro Triggers
        run: |
          # 1. Ensure target platform is set
          if ! grep -qE "^[[:space:]]*platform[[:space:]]+:ios" ios/Podfile; then
            echo "Inserting 'platform :ios, 15.0' into ios/Podfile"
            { echo "platform :ios, '15.0'"; cat ios/Podfile; } > /tmp/Podfile.new
            mv /tmp/Podfile.new ios/Podfile
          fi

          # 2. Add permission macros INSIDE the existing post_install hook
          #    (CocoaPods does not support multiple post_install hooks)
          python3 - <<'PY'
          import re
          path = 'ios/Podfile'
          src = open(path).read()

          if 'PERMISSION_CAMERA=1' in src:
              print('Macros already present, skipping')
              raise SystemExit(0)

          block = """
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] ||= ['$(inherited)']
                config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] += [
                  'PERMISSION_CAMERA=1',
                  'PERMISSION_PHOTOS=1',
                  'PERMISSION_MICROPHONE=1',
                ]
              end
          """

          pattern = r'(^[ \t]*flutter_additional_ios_build_settings\(target\)[ \t]*\n)'
          if re.search(pattern, src, re.M):
              src = re.sub(pattern, lambda m: m.group(1) + block, src, count=1, flags=re.M)
          else:
              src += """
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
          """ + block + """
            end
          end
          """
          open(path, 'w').write(src)
          print('Podfile patched')
          PY

          echo "--- post_install hook count (must be 1) ---"
          grep -c "post_install do" ios/Podfile
          echo "--- ios/Podfile (Tail View) ---"
          tail -35 ios/Podfile

      - name: Pin iOS deployment target in Xcode project
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj || true
          echo "--- IPHONEOS_DEPLOYMENT_TARGET = 15.0 count ---"
          grep -c "IPHONEOS_DEPLOYMENT_TARGET = 15.0;" ios/Runner.xcodeproj/project.pbxproj || true

      - name: Auto-Inject Bundle Identifier
        run: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = com.filosign.app;/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Clean CocoaPods State
        run: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod cache clean --all || true

      - name: Align TensorFlowLite pod versions (2.12.0 -> 2.14.0)
        run: |
          PODSPEC=$(python3 - <<'PY'
          import json, os
          cfg_path = '.dart_tool/package_config.json'
          cfg = json.load(open(cfg_path))
          base = os.path.dirname(os.path.abspath(cfg_path))
          for p in cfg['packages']:
              if p['name'] == 'tflite_flutter':
                  root = p['rootUri']
                  if root.startswith('file://'):
                      root = root[len('file://'):]
                  else:
                      root = os.path.normpath(os.path.join(base, root))
                  print(os.path.join(root, 'ios', 'tflite_flutter.podspec'))
          PY
          )
          echo "Podspec: $PODSPEC"
          echo "--- before ---"
          grep -n "TensorFlow\|2\.12" "$PODSPEC" || true
          sed -i '' 's/2\.12\.0/2.14.0/g' "$PODSPEC"
          echo "--- after ---"
          grep -n "TensorFlow\|2\.14" "$PODSPEC" || true
          if grep -q "2\.12\.0" "$PODSPEC"; then
            echo "Patch did not apply, check the podspec format above"
            exit 1
          fi

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign --no-pub

      - name: Verify camera permissions in built app
        run: |
          APP_PLIST="build/ios/iphoneos/Runner.app/Info.plist"
          plutil -p "$APP_PLIST" | grep -E "UsageDescription"
          if ! plutil -p "$APP_PLIST" | grep -q NSCameraUsageDescription; then
            echo "NSCameraUsageDescription missing from built app"
            exit 1
          fi

      - name: Manually Package App Payload
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app-release.ipa Payload/

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-iOS-App
          path: app-release.ipa
          retention-days: 7
